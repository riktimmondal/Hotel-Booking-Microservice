server:
  port: 8084

spring:
  application:
    name: APIGATEWAY

  cloud: 
    gateway:
      default-filters:
        - TokenRelay
      routes:
        - id: USERSERVICE
          uri: lb://USERSERVICE
          predicates:
            - Path=/users/**

        - id: HOTELSERVICE
          uri: lb://HOTELSERVICE
          predicates:
            - Path=/hotels/**
        
        - id: RATINGSERVICE
          uri: lb://RATINGSERVICE
          predicates:
            - Path=/ratings/**
  
  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: 4UP9SMedq9mSolLu40xMtzlVF29pGH1d
            client-secret: 
            scope: openid, email, profile, offline_access, Admin
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/auth0"
        provider:
          auth0::
            issuer-uri: https://dev-ybep4ljr28q257j5.us.auth0.com/
            jwk-set-uri: https://dev-ybep4ljr28q257j5.us.auth0.com/.well-known/jwks.json
      resourceserver:
        jwt:
          issuer-uri: https://dev-ybep4ljr28q257j5.us.auth0.com/

auth0:
  audience: https://dev-ybep4ljr28q257j5.us.auth0.com/api/v2/

eureka: 
  instance:
    prefer-ip-address: true
  client: 
    fetch-registry: true
    register-with-eureka: true
    service-url: 
      defaultZone: http://localhost:8761/eureka